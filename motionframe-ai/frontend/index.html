<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotionFrame AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-4xl font-bold text-center mb-8">MotionFrame AI</h1>
        <div class="max-w-lg mx-auto bg-white rounded-lg shadow-md p-8">
            <form id="upload-form" enctype="multipart/form-data">
                <div class="mb-4">
                    <label for="image" class="block text-gray-700 font-bold mb-2">Upload Image (JPG or PNG)</label>
                    <input type="file" name="image" id="image" accept="image/jpeg, image/png" class="w-full px-3 py-2 border rounded-lg">
                </div>
                <div class="mb-4">
                    <label for="prompt" class="block text-gray-700 font-bold mb-2">Camera Motion Prompt</label>
                    <input type="text" name="prompt" id="prompt" placeholder="e.g., slow zoom in, pan left" class="w-full px-3 py-2 border rounded-lg">
                </div>
                <div class="mb-4">
                    <label for="duration" class="block text-gray-700 font-bold mb-2">Video Duration (seconds)</label>
                    <select name="duration" id="duration" class="w-full px-3 py-2 border rounded-lg">
                        <option value="5">5</option>
                        <option value="10">10</option>
                        <option value="20">20</option>
                    </select>
                </div>
                <div class="text-center">
                    <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">Generate Video</button>
                </div>
            </form>
            <div id="loading" class="hidden text-center mt-4">
                <p>Generating video... This may take a few minutes.</p>
                <div class="w-full bg-gray-200 rounded-full mt-2">
                    <div id="progress-bar" class="bg-blue-500 text-xs font-medium text-blue-100 text-center p-0.5 leading-none rounded-full" style="width: 0%">0%</div>
                </div>
            </div>
            <div id="video-container" class="hidden text-center mt-4">
                <video id="video" controls class="w-full"></video>
                <a id="download-btn" href="#" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg mt-4 inline-block">Download Video</a>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
